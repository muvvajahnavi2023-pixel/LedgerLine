<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLine | Banking Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">LL</div>
                <div>
                    <h1 class="text-sm font-bold text-white" id="welcomeUser">LedgerLine Portal</h1>
                    <p class="text-[10px] text-slate-400">Authenticated Session Active</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">Logout</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left Column: Transaction Terminal (Transfer / Deposit) -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-semibold text-white mb-4">Transaction Terminal</h2>
                
                <div class="flex space-x-2 mb-5">
                    <button onclick="switchTab('transfer')" id="btnTransfer" class="flex-1 py-2 rounded-xl text-xs font-medium bg-blue-600 text-white transition">Transfer</button>
                    <button onclick="switchTab('deposit')" id="btnDeposit" class="flex-1 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 transition">Deposit</button>
                </div>

                <form id="transactionForm" onsubmit="submitTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1" id="sourceLabel">Source Account ID</label>
                        <input type="number" id="sourceAccountId" value="1000" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <div id="targetAccountContainer">
                        <label class="block text-xs font-medium text-slate-300 mb-1">Target Account ID</label>
                        <input type="number" id="targetAccountId" value="500" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" value="50.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Reference Code / Memo</label>
                        <input type="text" id="reference" value="TXN-2001" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm font-mono focus:outline-none focus:border-blue-500">
                    </div>

                    <button type="submit" id="actionBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-blue-500/25 transition text-sm">
                        Process Transfer
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: User Profile & Professional Success Receipt Box -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-semibold text-white mb-4">Authenticated User Account Details</h2>
                <div id="userInfoBox" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs font-mono bg-slate-950 p-4 rounded-xl border border-slate-800 text-slate-300">
                    <!-- Loaded dynamically via Session -->
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-base font-semibold text-white mb-4">Live Transaction Settlement Receipt</h2>
                
                <div id="receiptBox" class="text-xs text-slate-400 italic">
                    <div class="bg-slate-950 border border-slate-800 p-6 rounded-xl text-center text-slate-500">
                        Execute a transaction from the terminal to view professional verification receipts.
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let currentMode = 'transfer';

        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('ledgerUser'));
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            document.getElementById('welcomeUser').innerText = `Welcome, ${user.username}`;
            document.getElementById('userInfoBox').innerHTML = `
                <div>User ID: <span class="text-blue-400">#${user.id}</span></div>
                <div>Username: <span class="text-white">${user.username}</span></div>
                <div>Email: <span class="text-slate-400">${user.email}</span></div>
                <div>Created: <span class="text-slate-400">${new Date(user.createdAt).toLocaleDateString()}</span></div>
            `;
        };

        function switchTab(mode) {
            currentMode = mode;
            const btnT = document.getElementById('btnTransfer');
            const btnD = document.getElementById('btnDeposit');
            const targetContainer = document.getElementById('targetAccountContainer');
            const sourceLabel = document.getElementById('sourceLabel');
            const actionBtn = document.getElementById('actionBtn');

            if (mode === 'transfer') {
                btnT.className = "flex-1 py-2 rounded-xl text-xs font-medium bg-blue-600 text-white transition";
                btnD.className = "flex-1 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 transition";
                targetContainer.style.display = 'block';
                sourceLabel.innerText = "Source Account ID";
                actionBtn.innerText = "Process Transfer";
            } else {
                btnD.className = "flex-1 py-2 rounded-xl text-xs font-medium bg-emerald-600 text-white transition";
                btnT.className = "flex-1 py-2 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 transition";
                targetContainer.style.display = 'none';
                sourceLabel.innerText = "Account ID for Deposit";
                actionBtn.innerText = "Process Deposit";
            }
        }

        async function submitTransaction(event) {
            event.preventDefault();
            const receiptBox = document.getElementById('receiptBox');

            const payload = {
                sourceAccountId: Number(document.getElementById('sourceAccountId').value),
                targetAccountId: currentMode === 'transfer' ? Number(document.getElementById('targetAccountId').value) : Number(document.getElementById('sourceAccountId').value),
                amount: Number(document.getElementById('amount').value),
                reference: document.getElementById('reference').value,
                description: document.getElementById('reference').value
            };

            try {
                const response = await fetch('/api/ledger/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Professional Success Card Box Layout
                    receiptBox.innerHTML = `
                        <div class="bg-slate-900 border border-emerald-500/30 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
                            
                            <div class="flex items-center space-x-3 mb-5">
                                <div class="h-10 w-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-lg shadow-lg">
                                    ✓
                                </div>
                                <div>
                                    <h3 class="text-base font-bold text-white">Transfer Successful</h3>
                                    <p class="text-xs text-slate-400">Transaction ID: <span class="font-mono text-emerald-400 font-semibold">#${data.id}</span></p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                    <span class="text-[10px] uppercase tracking-wider text-slate-500 block mb-1 font-medium">Source Account</span>
                                    <div class="flex items-baseline justify-between">
                                        <span class="text-sm font-mono font-bold text-white">#${data.sourceAccount.id}</span>
                                        <span class="text-xs font-mono text-emerald-400">$${data.sourceAccount.balance.toFixed(2)}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-400 mt-1">${data.sourceAccount.user.username} (USD)</p>
                                </div>

                                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                    <span class="text-[10px] uppercase tracking-wider text-slate-500 block mb-1 font-medium">Target Account</span>
                                    <div class="flex items-baseline justify-between">
                                        <span class="text-sm font-mono font-bold text-white">#${data.targetAccount.id}</span>
                                        <span class="text-xs font-mono text-emerald-400">$${data.targetAccount.balance.toFixed(2)}</span>
                                    </div>
                                    <p class="text-[11px] text-slate-400 mt-1">${data.targetAccount.user.username} (USD)</p>
                                </div>
                            </div>

                            <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center text-xs space-y-2 sm:space-y-0">
                                <div>
                                    <span class="text-slate-500 block">Reference / Memo</span>
                                    <span class="font-mono text-slate-300">${data.description || 'N/A'}</span>
                                </div>
                                <div class="text-right w-full sm:w-auto">
                                    <span class="text-slate-500 block">Settled Amount</span>
                                    <span class="font-mono font-bold text-emerald-400 text-sm">$${data.amount.toFixed(2)} USD</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(data.message || JSON.stringify(data));
                }
            } catch (err) {
                receiptBox.innerHTML = `
                    <div class="bg-rose-950/40 border border-rose-800/60 p-4 rounded-xl text-rose-300 text-xs">
                        <strong>Transaction Failed:</strong> ${err.message}
                    </div>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('ledgerUser');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
