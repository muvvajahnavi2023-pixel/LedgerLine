<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerLine - Financial Ledger Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1, h2 { margin-top: 0; color: #1a252c; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: 600; width: 100%; }
        button:hover { background-color: #1d4ed8; }
        .alert { padding: 12px; border-radius: 4px; margin-top: 16px; display: none; font-size: 14px; }
        .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LedgerLine Dashboard</h1>

        <div class="card">
            <h2>Execute Double-Entry Transfer</h2>
            <form id="transferForm">
                <div class="form-group">
                    <label for="sourceAccountId">Source Account ID</label>
                    <input type="number" id="sourceAccountId" required placeholder="e.g. 1">
                </div>
                <div class="form-group">
                    <label for="targetAccountId">Target Account ID</label>
                    <input type="number" id="targetAccountId" required placeholder="e.g. 2">
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" required placeholder="e.g. 100.00">
                </div>
                <div class="form-group">
                    <label for="reference">Idempotency Reference Key</label>
                    <input type="text" id="reference" required placeholder="e.g. TXN-1001">
                </div>
                <button type="submit">Process Transfer</button>
            </form>
            <div id="responseAlert" class="alert"></div>
        </div>
    </div>

    <script>
        document.getElementById('transferForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('responseAlert');
            alertBox.style.display = 'none';

            const payload = {
                sourceAccountId: parseInt(document.getElementById('sourceAccountId').value),
                targetAccountId: parseInt(document.getElementById('targetAccountId').value),
                amount: parseFloat(document.getElementById('amount').value),
                reference: document.getElementById('reference').value
            };

            try {
                const response = await fetch('/api/ledger/transfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.text();
                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Transfer successful! Transaction details: ' + data;
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = 'Transfer failed: ' + data;
                }
                alertBox.style.display = 'block';
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = 'Network or server error: ' + err.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
